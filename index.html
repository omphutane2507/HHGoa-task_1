<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Goa 2026 - ID Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- HEIC to JPG conversion library -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">HH GOA <span>2026</span></div>
            <h1>BUILDER ID GENERATOR</h1>
            <p>Less Noise. More Signal. Generate your official radar card.</p>
        </header>

        <main class="app-layout">
            <div class="controls-section">
                <form id="generator-form">
                    <div class="input-group">
                        <label for="photo-upload" class="file-upload-label" id="file-upload-label">
                            <span id="file-name">UPLOAD YOUR PHOTO (JPG, PNG, HEIC)</span>
                            <input type="file" id="photo-upload" accept="image/jpeg, image/png, image/heic, .heic" required>
                        </label>
                    </div>

                    <div class="input-group">
                        <label for="builder-name">Name / Alias</label>
                        <input type="text" id="builder-name" placeholder="e.g. Satoshi" required maxlength="20" autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="builder-stack">Stack / Role</label>
                        <input type="text" id="builder-stack" placeholder="e.g. Full-Stack / Rust" required maxlength="25" autocomplete="off">
                    </div>

                    <button type="submit" id="generate-btn" class="primary-btn">GENERATE ID CARD</button>
                </form>
                
                <div id="actions-section" class="actions hidden">
                    <button id="download-btn" class="action-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        DOWNLOAD
                    </button>
                    <button id="share-btn" class="action-btn x-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                        SHARE ON X
                    </button>
                </div>
            </div>

            <div class="preview-section">
                <div class="canvas-container" id="canvas-wrapper">
                    <canvas id="id-canvas"></canvas>
                    <div id="placeholder-overlay" class="placeholder-overlay">
                        PREVIEW
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
